<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel (Pyodide/WebAssembly)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="ui inverted menu">
        <div class="ui container">
            <div class="header item"><i class="table icon"></i> Excel (Pyodide/WebAssembly)</div>
            <div class="item">Pyodide · WebAssembly · Handsontable · Semantic UI</div>
        </div>
    </div>

    <div class="ui container">
        <div id="status" class="ui icon info message">
            <i class="notched circle loading icon"></i>
            <div class="content">
                <div class="header">Loading Python runtime…</div>
                <p id="status-text">Downloading Pyodide, pandas and openpyxl (first load may take a while).</p>
            </div>
        </div>

        <div class="ui segment">
            <form class="ui form" onsubmit="return false;">
                <div class="three fields">
                    <div class="field">
                        <label>Excel file (.xlsx)</label>
                        <input type="file" id="file-input" accept=".xlsx,.xlsm" disabled />
                    </div>
                    <div class="field">
                        <label>Sheet</label>
                        <select id="sheet-select" class="ui fluid dropdown" disabled></select>
                    </div>
                    <div class="field">
                        <label>Header row (0-based, -1 = none)</label>
                        <input type="number" id="header-row" value="0" min="-1" />
                    </div>
                </div>
                <div class="ui buttons">
                    <button id="btn-sample" class="ui primary button" disabled><i class="file excel icon"></i> Load
                        sample.xlsx</button>
                    <button id="btn-reload" class="ui button" disabled><i class="sync icon"></i> Reload sheet</button>
                    <button id="btn-describe" class="ui teal button" disabled><i class="chart bar icon"></i>
                        df.describe()</button>
                    <button id="btn-download" class="ui green button" disabled><i class="download icon"></i> Save as
                        .xlsx</button>
                </div>
            </form>
        </div>

        <div class="ui segment">
            <h4 class="ui header">
                <i class="th icon"></i>
                <div class="content">Data <div class="sub header" id="data-info">No file loaded</div>
                </div>
            </h4>
            <div id="grid"></div>
        </div>

        <div class="ui segment" id="stats-segment" style="display:none">
            <h4 class="ui header"><i class="calculator icon"></i> Summary statistics (pandas)</h4>
            <div id="stats-grid"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
