<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WASM Excel Viewer (Handsontable)</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handsontable/18.1.0/handsontable.full.min.js"></script>
</head>

<body style="margin: 0; padding: 8px; font-family: Arial, sans-serif;">
    <div class="ui segment">
        <h2 class="ui header">📊 Excel Loader — Rust/WebAssembly + Handsontable</h2>
        <div class="ui divider"></div>
        The <code>.xlsx</code>/<code>.xls</code> file is parsed entirely in your
        browser by a WebAssembly module compiled from Rust
        (<a href="https://github.com/tafia/calamine" target="_blank" rel="noopener">calamine</a>).
        No file is ever uploaded to a server.
    </div>

    <main>
        <div class="ui segment">
            <label class="file-picker">
                <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" />
                <span>Choose Excel file…</span>
            </label>

            <select id="sheetSelect" disabled>
                <option>No sheets loaded</option>
            </select>

            <button class="ui primary button" id="exportBtn" disabled>Export to CSV</button>
            <span id="status" class="status"></span>
        </div>
        <section id="hotContainer"></section>
        <div class="ui segment">
            <p id="clock"></p>
        </div>
        <br>
    </main>

    <script type="module" src="./app.js"></script>
    <script>
        setInterval(() => {
            let d = new Date();
            let w = [
                "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday",
                "Friday", "Saturday"];
            let m = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];

            $("#clock").html(
                `${w[d.getDay()]}, ${m[d.getMonth()]} ${d.getUTCDate()}, ${d.getFullYear()} ${d.toLocaleTimeString()}`);

            /*
            document.getElementById("clock").innerHTML =
                `${w[d.getDay()]}, ${m[d.getMonth()]} ${d.getUTCDate()}, ${d.getFullYear()} ${d.toLocaleTimeString()}`
            */
        }, 1000);
    </script>
</body>

</html>
